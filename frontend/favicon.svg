<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Radar sweep circles -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Financial Orderbook Candlestick / Radar Beam -->
  <path d="M16 44 L28 28 L38 36 L48 18" fill="none" stroke="url(#cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- High Squeeze Burst Indicator -->
  <circle cx="48" cy="18" r="4.5" fill="url(#gold)"/>
  <circle cx="48" cy="18" r="7" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
  
  <!-- Subtle center pulse -->
  <circle cx="32" cy="32" r="2" fill="#38bdf8"/>
</svg>
